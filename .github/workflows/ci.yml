name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJ1939_DDS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DJ1939_DDS_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  cyclonedds:
    name: Cyclone DDS integration build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-dds
          -DCMAKE_BUILD_TYPE=Release
          -DJ1939_DDS_ENABLE_CYCLONEDDS=ON
          -DJ1939_DDS_FETCH_CYCLONEDDS=ON
      - name: Build
        run: cmake --build build-dds --parallel 2
      - name: Test core pipeline
        run: ctest --test-dir build-dds --output-on-failure
      - name: Test DDS publisher/subscriber round trip
        run: ./scripts/test_dds_roundtrip.sh build-dds
